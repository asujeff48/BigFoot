<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup B — Ranger Log | Bigfoot Sightings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --pine: #1c3a2e;
      --moss: #3d6b4f;
      --fog: #d7e0d9;
      --ink: #14201a;
      --bark: #5c4030;
      --paper: #e8efe6;
      --accent: #2f6f7a;
      --line: rgba(28, 58, 46, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: Manrope, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(160deg, #c5d4c8 0%, #9fb5a6 45%, #7f9788 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.35), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(28,58,46,0.12), transparent 35%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    }

    .frame {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(0.75rem, 2vw, 1.25rem);
      gap: 0.75rem;
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
      animation: settleIn 700ms ease both;
    }

    @keyframes settleIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-family: Literata, serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 7vw, 4.8rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      color: var(--pine);
    }

    .sub {
      margin-top: 0.4rem;
      max-width: 28rem;
      font-size: 0.95rem;
      line-height: 1.45;
      color: rgba(20, 32, 26, 0.78);
    }

    .controls {
      background: rgba(232, 239, 230, 0.92);
      border: 1px solid var(--line);
      padding: 0.85rem 1rem;
      min-width: min(22rem, 92vw);
      backdrop-filter: blur(6px);
    }

    .controls label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 0.55rem;
    }

    .ranges {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
    }

    .ranges button {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--pine);
      padding: 0.55rem 0.35rem;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .ranges button:hover {
      border-color: var(--pine);
    }

    .ranges button.active {
      background: var(--pine);
      border-color: var(--pine);
      color: var(--paper);
    }

    .count {
      margin-top: 0.65rem;
      font-size: 0.8rem;
      color: var(--bark);
      font-weight: 600;
    }

    .map-shell {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(28, 58, 46, 0.28);
      background: var(--paper);
      overflow: hidden;
      animation: mapRise 900ms 120ms ease both;
    }

    @keyframes mapRise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #map {
      position: absolute;
      inset: 0;
      background: #d5e0d4;
    }

    .corner-note {
      position: absolute;
      z-index: 5;
      left: 1rem;
      bottom: 1rem;
      max-width: 16rem;
      background: rgba(232, 239, 230, 0.94);
      border-left: 3px solid var(--accent);
      padding: 0.7rem 0.85rem;
      font-size: 0.78rem;
      line-height: 1.4;
      color: var(--ink);
      pointer-events: none;
    }

    .corner-note strong {
      display: block;
      font-family: Literata, serif;
      font-size: 0.95rem;
      margin-bottom: 0.2rem;
      color: var(--pine);
    }

    .leaflet-control-zoom {
      border: 1px solid rgba(28, 58, 46, 0.25) !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      background: var(--paper) !important;
      color: var(--pine) !important;
      border-bottom-color: rgba(28, 58, 46, 0.15) !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 34px !important;
    }

    .leaflet-control-attribution {
      background: rgba(232, 239, 230, 0.85) !important;
      color: rgba(20, 32, 26, 0.65) !important;
      font-family: Manrope, sans-serif !important;
    }

    .bf-div-icon {
      background: transparent !important;
      border: none !important;
      overflow: visible !important;
    }

    .bf-marker {
      width: 52px;
      height: 64px;
      display: grid;
      place-items: end center;
      transition: transform 180ms ease;
    }

    .bf-silhouette {
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    .bf-marker:hover { transform: translateY(-3px) scale(1.05); }

    .leaflet-popup-content-wrapper {
      background: var(--paper);
      color: var(--ink);
      border-radius: 2px;
      border: 1px solid rgba(28, 58, 46, 0.2);
      box-shadow: none;
      font-family: Manrope, sans-serif;
    }

    .leaflet-popup-tip { background: var(--paper); }
    .leaflet-popup-close-button { color: var(--pine) !important; }

    .popup-title {
      font-family: Literata, serif;
      font-size: 1.15rem;
      color: var(--pine);
      margin-bottom: 0.4rem;
    }

    .popup-meta {
      font-size: 0.8rem;
      line-height: 1.55;
    }

    .popup-meta dt {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--moss);
      margin-top: 0.4rem;
    }

    .popup-meta dd { margin: 0; }

    @media (max-width: 760px) {
      .masthead { grid-template-columns: 1fr; align-items: start; }
      .ranges { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="masthead">
      <div>
        <h1 class="brand">Bigfoot</h1>
        <p class="sub">A ranger-style field log of recent sightings — zoom the map, then open any silhouette for place, date, and time.</p>
      </div>
      <div class="controls">
        <label id="rangeLabel">Report window</label>
        <div class="ranges" role="group" aria-labelledby="rangeLabel">
          <button type="button" data-range="recent" class="active">Recently posted</button>
          <button type="button" data-range="year">This year</button>
          <button type="button" data-range="all">All time</button>
        </div>
        <p class="count" id="countLabel">0 sightings on map</p>
      </div>
    </header>

    <div class="map-shell">
      <div id="map" role="application" aria-label="US Bigfoot sightings map"></div>
      <aside class="corner-note">
        <strong>How to explore</strong>
        Scroll to zoom, drag to pan. Click a figure for the report card.
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./shared-sightings.js"></script>
  <script>
    const map = L.map("map", {
      center: [39.8, -98.5],
      zoom: 4,
      minZoom: 3,
      maxZoom: 12,
    });

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 19,
    }).addTo(map);

    const iconHtml = BF_markerSvg("#1c3a2e", 52, 64);

    const bfIcon = L.divIcon({
      className: "bf-div-icon",
      html: `<div class="bf-marker">${iconHtml}</div>`,
      iconSize: [52, 64],
      iconAnchor: [26, 64],
      popupAnchor: [0, -58],
    });

    const layer = L.layerGroup().addTo(map);
    let activeRange = "recent";

    function render() {
      layer.clearLayers();
      const visible = BF_SIGHTINGS.filter((s) => BF_inWindow(s, activeRange));

      visible.forEach((s) => {
        const f = BF_popupFields(s);
        L.marker([s.lat, s.lng], { icon: bfIcon })
          .bindPopup(`
            <div class="popup-title">Field report</div>
            <dl class="popup-meta">
              <dt>Location</dt><dd>${BF_esc(f.location)}</dd>
              <dt>Date</dt><dd>${BF_esc(f.date)}</dd>
              <dt>Time</dt><dd>${BF_esc(f.time)}</dd>
              <dt>Type</dt><dd>${BF_esc(f.type)} · ${BF_esc(f.klass)}</dd>
            </dl>
            <p class="popup-meta" style="margin-top:0.6rem"><a href="${BF_esc(f.url)}" target="_blank" rel="noopener">BFRO report ${BF_esc(s.id)}</a></p>
          `)
          .addTo(layer);
      });

      document.getElementById("countLabel").textContent =
        `${visible.length} sighting${visible.length === 1 ? "" : "s"} on map`;
    }

    document.querySelectorAll(".ranges button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".ranges button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeRange = btn.dataset.range;
        render();
      });
    });

    render();
  </script>
</body>
</html>
