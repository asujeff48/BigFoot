<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bigfoot Sightings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0a100c;
      --panel: rgba(8, 16, 12, 0.88);
      --ir: #6dff9a;
      --ir-dim: #2a6b45;
      --fog: #9bb5a4;
      --line: rgba(109, 255, 154, 0.22);
      --warn: #c8ff6d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fog);
      font-family: "IBM Plex Mono", monospace;
      overflow: hidden;
    }

    .stage {
      position: relative;
      height: 100%;
      isolation: isolate;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: #2a3230;
    }

    /* Color grade tiles only — never the markers */
    .leaflet-tile-pane {
      filter: grayscale(0.25) contrast(1.02) brightness(1.28) sepia(0.12) hue-rotate(70deg);
    }

    /* Camera overlays sit under the map so silhouettes stay visible */
    .scanlines,
    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .scanlines {
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.08) 0px,
          rgba(0, 0, 0, 0.08) 1px,
          transparent 2px,
          transparent 4px
        );
      mix-blend-mode: multiply;
      opacity: 0.22;
      animation: flicker 6s steps(2) infinite;
    }

    @keyframes flicker {
      0%, 92%, 100% { opacity: 0.22; }
      93% { opacity: 0.12; }
      94% { opacity: 0.26; }
    }

    .vignette {
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.22) 100%);
    }

    .chrome {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 0;
      padding: 1.25rem 1.5rem 0;
      pointer-events: none;
    }

    .chrome > * { pointer-events: auto; }

    .brand-block {
      max-width: 28rem;
    }

    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(3.5rem, 9vw, 6.5rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
      color: var(--ir);
      text-shadow: 0 0 24px rgba(109, 255, 154, 0.35);
      animation: brandPulse 4s ease-in-out infinite;
    }

    @keyframes brandPulse {
      0%, 100% { text-shadow: 0 0 18px rgba(109, 255, 154, 0.25); }
      50% { text-shadow: 0 0 32px rgba(109, 255, 154, 0.55); }
    }

    .tagline {
      margin-top: 0.65rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fog);
      max-width: 22rem;
    }

    .hud {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      padding: 0.85rem 1rem;
      min-width: min(24rem, 90vw);
    }

    .hud-label {
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ir-dim);
      margin-bottom: 0.55rem;
    }

    .ranges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .ranges button {
      font-family: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: transparent;
      color: var(--fog);
      border: 1px solid var(--line);
      padding: 0.45rem 0.65rem;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .ranges button:hover {
      border-color: var(--ir);
      color: var(--ir);
    }

    .ranges button.active {
      background: var(--ir);
      color: #041008;
      border-color: var(--ir);
      font-weight: 600;
    }

    .ranges + .ranges {
      margin-top: 0.4rem;
    }

    .ranges button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .you-are-here {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ir);
      border: 2px solid #041008;
      box-shadow: 0 0 0 3px rgba(109, 255, 154, 0.28), 0 0 12px var(--ir);
    }

    .meta {
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.7rem;
      color: var(--warn);
    }

    .updated {
      margin-top: 0.45rem;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: var(--fog);
      line-height: 1.4;
    }

    .footer-bar {
      position: absolute;
      z-index: 5;
      left: 1.5rem;
      bottom: 1.25rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1rem;
      pointer-events: none;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.55rem;
      pointer-events: auto;
    }

    .rec {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--ir);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 0.45rem 0.7rem;
      pointer-events: auto;
    }

    .rec-dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 8px #ff4d4d;
      animation: blink 1.2s steps(1) infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.15; }
    }

    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
      pointer-events: auto;
      max-width: min(22rem, 90vw);
    }

    .legend {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      padding: 0.85rem 1rem;
    }

    .legend-note {
      font-size: 0.62rem;
      line-height: 1.4;
      color: var(--warn);
      margin: 0 0 0.15rem;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 4.4rem 1fr;
      gap: 0.45rem 0.65rem;
      margin-top: 0.45rem;
      font-size: 0.68rem;
      line-height: 1.35;
    }

    .hint {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(155, 181, 164, 0.75);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 0.45rem 0.7rem;
    }

    .legend-row dt {
      color: var(--ir);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend-row dd {
      margin: 0;
      color: var(--fog);
    }

    .popup-note {
      margin-top: 0.45rem;
      font-size: 0.68rem;
      line-height: 1.4;
      color: var(--fog);
    }

    .leaflet-control-zoom {
      border: 1px solid var(--line) !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--ir) !important;
      border-bottom-color: var(--line) !important;
      width: 32px !important;
      height: 32px !important;
      line-height: 32px !important;
      font-size: 16px !important;
    }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.55) !important;
      color: rgba(155, 181, 164, 0.7) !important;
      font-family: "IBM Plex Mono", monospace !important;
      font-size: 10px !important;
    }

    .leaflet-control-attribution a { color: var(--ir) !important; }

    .bf-div-icon {
      background: transparent !important;
      border: none !important;
      overflow: visible !important;
    }

    .bf-marker {
      width: 32px;
      height: 42px;
      display: grid;
      place-items: end center;
      transition: transform 160ms ease;
    }

    .bf-silhouette {
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    .bf-marker:hover { transform: scale(1.08); }

    .leaflet-popup-content-wrapper {
      background: #0b1610;
      color: var(--fog);
      border: 1px solid var(--ir);
      border-radius: 0;
      box-shadow: 0 0 24px rgba(109, 255, 154, 0.2);
      font-family: "IBM Plex Mono", monospace;
    }

    .leaflet-popup-tip { background: #0b1610; border: 1px solid var(--ir); }
    .leaflet-popup-close-button { color: var(--ir) !important; }

    .popup-title {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      color: var(--ir);
      margin-bottom: 0.35rem;
    }

    .popup-row {
      font-size: 0.72rem;
      margin-top: 0.35rem;
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.35rem;
    }

    .popup-row span:first-child {
      color: var(--ir-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .popup-link {
      display: inline-block;
      margin-top: 0.65rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ir);
    }

    @media (max-width: 720px) {
      .chrome { padding: 1rem; }
      .brand { font-size: 3.2rem; }
      .footer-bar { left: 1rem; right: 1rem; bottom: 1rem; flex-direction: column; align-items: start; }
      .hud { min-width: 0; width: 100%; }
      .footer-right { align-items: stretch; max-width: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="map" role="application" aria-label="US Bigfoot sightings map"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="chrome">
      <div class="brand-block">
        <h1 class="brand">BIGFOOT</h1>
        <p class="tagline">Infrared trail-cam feed of BFRO-reported sightings across the contiguous United States.</p>
      </div>
    </header>

    <div class="footer-bar">
      <div class="footer-left">
        <div class="hud">
          <div class="hud-label" id="hudLabel">Report window</div>
          <div class="ranges" role="tablist" aria-label="Time range">
            <button type="button" data-range="recent" class="active">Recently posted</button>
            <button type="button" data-range="year">This year</button>
            <button type="button" data-range="all">All time</button>
          </div>
          <div class="ranges">
            <button type="button" id="nearMeBtn">Sightings Near Me</button>
            <button type="button" id="updateBtn">Update Sightings Now</button>
          </div>
          <div class="meta">
            <span id="countLabel">0 contacts</span>
            <span id="camLabel">BFRO · CAM-07</span>
          </div>
          <p class="updated" id="updatedLabel">Last updated —</p>
        </div>
        <div class="rec"><span class="rec-dot" aria-hidden="true"></span> REC · LIVE OVERLAY</div>
      </div>
      <div class="footer-right">
        <div class="legend">
          <div class="hud-label">BFRO class</div>
          <p class="legend-note" id="classNote"></p>
          <dl class="legend-row" id="classLegend"></dl>
        </div>
        <div class="hint">Scroll to zoom · drag to pan · tap a silhouette</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./shared-sightings.js"></script>
  <script>
    const map = L.map("map", {
      center: [39.5, -98.35],
      zoom: 4,
      minZoom: 3,
      maxZoom: 12,
      zoomControl: true,
      worldCopyJump: false,
    });

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri",
      maxZoom: 16,
    }).addTo(map);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
      attribution: "Tiles &copy; Esri · Reports &copy; <a href=\"https://www.bfro.net/GDB/\">BFRO</a>",
      maxZoom: 16,
      opacity: 0.85,
    }).addTo(map);

    const iconHtml = BF_markerSvg("#6dff9a", 32, 42, { glow: true });

    const bfIcon = L.divIcon({
      className: "bf-div-icon",
      html: `<div class="bf-marker">${iconHtml}</div>`,
      iconSize: [32, 42],
      iconAnchor: [16, 42],
      popupAnchor: [0, -38],
    });

    document.getElementById("classNote").textContent = BF_CLASS_NOTE;
    document.getElementById("classLegend").innerHTML = BF_classLegendHtml();

    const layer = L.layerGroup().addTo(map);
    const hereLayer = L.layerGroup().addTo(map);
    const nearMeBtn = document.getElementById("nearMeBtn");
    const updateBtn = document.getElementById("updateBtn");
    const hudLabel = document.getElementById("hudLabel");
    const countLabel = document.getElementById("countLabel");
    const camLabel = document.getElementById("camLabel");
    const updatedLabel = document.getElementById("updatedLabel");
    const hereIcon = L.divIcon({
      className: "bf-div-icon",
      html: '<div class="you-are-here" title="Your location"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });

    let activeRange = "recent";
    let nearMe = false;
    let userOrigin = null;
    let hereCircle = null;
    let lastUpdatedIso = BF_SNAPSHOT_AT;

    function showUpdated(iso, note) {
      lastUpdatedIso = iso || lastUpdatedIso;
      updatedLabel.textContent =
        (note ? note + " · " : "") + "Last updated " + BF_formatUpdatedAt(lastUpdatedIso);
    }

    function restoreCache() {
      try {
        const raw = localStorage.getItem(BF_CACHE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.sightings) || !data.sightings.length || !data.updatedAt) return false;
        window.BF_SIGHTINGS = data.sightings;
        lastUpdatedIso = data.updatedAt;
        return true;
      } catch (err) {
        return false;
      }
    }

    restoreCache();
    showUpdated(lastUpdatedIso);

    function visibleSightings() {
      if (nearMe && userOrigin) return BF_nearOrigin(BF_SIGHTINGS, userOrigin, BF_NEAR_MILES);
      return BF_SIGHTINGS.filter((s) => BF_inWindow(s, activeRange));
    }

    function drawHere() {
      hereLayer.clearLayers();
      hereCircle = null;
      if (!userOrigin) return;
      hereCircle = L.circle([userOrigin.lat, userOrigin.lng], {
        radius: BF_NEAR_MILES * 1609.344,
        color: "#6dff9a",
        weight: 1,
        dashArray: "5 7",
        fillColor: "#6dff9a",
        fillOpacity: 0.06,
        interactive: false,
      }).addTo(hereLayer);
      L.marker([userOrigin.lat, userOrigin.lng], { icon: hereIcon, zIndexOffset: 800 })
        .bindPopup("Your location · 150 mile radius")
        .addTo(hereLayer);
    }

    function exitNearMe() {
      nearMe = false;
      userOrigin = null;
      hereCircle = null;
      hereLayer.clearLayers();
      nearMeBtn.classList.remove("active");
      nearMeBtn.disabled = false;
      hudLabel.textContent = "Report window";
      camLabel.textContent = "BFRO · CAM-07";
      document.querySelectorAll("[data-range]").forEach((b) => {
        b.classList.toggle("active", b.dataset.range === activeRange);
      });
      map.setView([39.5, -98.35], 4);
    }

    function render() {
      layer.clearLayers();
      const visible = visibleSightings();

      visible.forEach((s) => {
        const f = BF_popupFields(s);
        const milesAway = userOrigin
          ? BF_formatMiles(BF_milesBetween(userOrigin.lat, userOrigin.lng, s.lat, s.lng))
          : "";
        const marker = L.marker([s.lat, s.lng], { icon: bfIcon });
        marker.bindPopup(`
          <div class="popup-title">CONTACT</div>
          <div class="popup-row"><span>Location</span><span>${BF_esc(f.location)}</span></div>
          <div class="popup-row"><span>Date</span><span>${BF_esc(f.date)}</span></div>
          <div class="popup-row"><span>Time</span><span>${BF_esc(f.time)}</span></div>
          <div class="popup-row"><span>Type</span><span>${BF_esc(f.type)} · ${BF_esc(f.klass)}</span></div>
          ${milesAway ? `<div class="popup-row"><span>Range</span><span>${BF_esc(milesAway)} away</span></div>` : ""}
          <p class="popup-note">${BF_esc(f.classMeaning)}</p>
          <a class="popup-link" href="${BF_esc(f.url)}" target="_blank" rel="noopener">BFRO report ${BF_esc(s.id)} ↗</a>
        `);
        marker.addTo(layer);
      });

      if (nearMe && userOrigin) {
        countLabel.textContent =
          `${visible.length} contact${visible.length === 1 ? "" : "s"} within 150 mi`;
      } else {
        countLabel.textContent =
          `${visible.length} contact${visible.length === 1 ? "" : "s"}`;
      }
    }

    function onLocated(pos) {
      nearMeBtn.disabled = false;
      nearMe = true;
      userOrigin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      nearMeBtn.classList.add("active");
      document.querySelectorAll("[data-range]").forEach((b) => b.classList.remove("active"));
      hudLabel.textContent = "Near you";
      camLabel.textContent = "150 mi · all time";
      drawHere();
      render();
      if (hereCircle) {
        map.fitBounds(hereCircle.getBounds(), { padding: [36, 36], maxZoom: 8 });
      }
    }

    function onLocateError(err) {
      nearMeBtn.disabled = false;
      if (err && err.code === 1) {
        countLabel.textContent = "Location permission denied";
      } else if (err && err.code === 3) {
        countLabel.textContent = "Location timed out";
      } else {
        countLabel.textContent = "Could not read location";
      }
      if (!userOrigin) {
        nearMe = false;
        nearMeBtn.classList.remove("active");
      }
    }

    document.querySelectorAll("[data-range]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeRange = btn.dataset.range;
        if (nearMe) exitNearMe();
        else {
          document.querySelectorAll("[data-range]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        }
        render();
      });
    });

    nearMeBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        countLabel.textContent = "Location not available";
        return;
      }
      nearMeBtn.disabled = true;
      countLabel.textContent = "Locating…";
      navigator.geolocation.getCurrentPosition(onLocated, onLocateError, {
        enableHighAccuracy: false,
        timeout: 12000,
        maximumAge: 300000,
      });
    });

    updateBtn.addEventListener("click", async () => {
      updateBtn.disabled = true;
      showUpdated(lastUpdatedIso, "Updating from BFRO");
      try {
        const res = await fetch(BF_NEW_ADDITIONS_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const kml = await res.text();
        const fresh = BF_parseNewAdditionsKml(kml);
        if (!fresh.length) throw new Error("empty");
        window.BF_SIGHTINGS = BF_mergeSightings(BF_SIGHTINGS_BUNDLED.slice(), fresh);
        const updatedAt = new Date().toISOString();
        localStorage.setItem(
          BF_CACHE_KEY,
          JSON.stringify({ updatedAt: updatedAt, sightings: window.BF_SIGHTINGS })
        );
        showUpdated(updatedAt);
        render();
      } catch (err) {
        showUpdated(lastUpdatedIso, "Update failed");
      } finally {
        updateBtn.disabled = false;
      }
    });

    render();
  </script>
</body>
</html>
