server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /bfro/new-additions.kml {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;
        proxy_pass http://www.bfro.net/app/NewAdditionsKML.aspx;
        proxy_set_header Host www.bfro.net;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "*/*";
        proxy_connect_timeout 20s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
